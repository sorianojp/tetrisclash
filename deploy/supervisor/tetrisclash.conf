# Long-running processes for Tetris Clash.
# Copy to /etc/supervisor/conf.d/tetrisclash.conf, then:
#   supervisorctl reread && supervisorctl update

# Reverb: the WebSocket server for live duels (presence, boards, attacks, results).
[program:tetrisclash-reverb]
command=php /var/www/tetrisclash/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/tetrisclash
user=www-data
autostart=true
autorestart=true
stopwaitsecs=10
minfds=10000
redirect_stderr=true
stdout_logfile=/var/www/tetrisclash/storage/logs/reverb.log

# Queue worker for anything the app queues (QUEUE_CONNECTION=database).
[program:tetrisclash-queue]
command=php /var/www/tetrisclash/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/tetrisclash
user=www-data
autostart=true
autorestart=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/tetrisclash/storage/logs/queue.log

# Scheduler: settles abandoned duels and keeps tournament brackets moving (duels:sweep).
[program:tetrisclash-scheduler]
command=php /var/www/tetrisclash/artisan schedule:work
directory=/var/www/tetrisclash
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/www/tetrisclash/storage/logs/scheduler.log

# Bot runner: plays the bots' matches over Reverb (see bots/runner.ts). Harmless when
# BOTS_ENABLED=false: it only plays duels bots are already in.
[program:tetrisclash-bots]
command=/var/www/tetrisclash/node_modules/.bin/tsx --env-file=.env bots/runner.ts
directory=/var/www/tetrisclash
user=www-data
autostart=true
autorestart=true
stopwaitsecs=15
redirect_stderr=true
stdout_logfile=/var/www/tetrisclash/storage/logs/bots.log
